services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodyblues
      POSTGRES_USER: moodyblues
      POSTGRES_PASSWORD: "${MOODYBLUES_DB_PASSWORD:?Set MOODYBLUES_DB_PASSWORD in a .env file to a random password}"
    # No `ports:` on purpose. The backend reaches Postgres over the compose network as `db`;
    # publishing 5432 to the host would expose the database to anything that can reach the box.
    volumes:
      - moodyblues-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodyblues -d moodyblues"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Bind all interfaces inside the container. No port is published to the host: the only way
      # in is through Nginx Proxy Manager on the shared `proxy` network (README "Deployment").
      MOODYBLUES_HOST: "0.0.0.0"
      MOODYBLUES_PORT: "8765"
      # Hostname clients reach the server on, handed back in handshake URLs. A real DNS name.
      MOODYBLUES_PUBLIC_HOST: "${MOODYBLUES_PUBLIC_HOST:?Set MOODYBLUES_PUBLIC_HOST in a .env file to the server's public domain name}"
      MOODYBLUES_PUBLIC_SCHEME: "https"
      MOODYBLUES_PUBLIC_PORT: "443"
      MOODYBLUES_DB_CONNECTION: "Host=db;Port=5432;Database=moodyblues;Username=moodyblues;Password=${MOODYBLUES_DB_PASSWORD}"
      MOODYBLUES_JWT_SECRET: "${MOODYBLUES_JWT_SECRET:?Set MOODYBLUES_JWT_SECRET in a .env file to a random secret of 32+ bytes}"
      MOODYBLUES_CORS_ORIGIN: "${MOODYBLUES_CORS_ORIGIN:?Set MOODYBLUES_CORS_ORIGIN in a .env file to the dashboard's origin(s)}"
      # The proxy sets X-Forwarded-For; trust it so rate limits apply per real client IP.
      # Safe only because this container is reachable solely through the proxy.
      MOODYBLUES_TRUST_FORWARDED_HEADERS: "true"
    volumes:
      - moodyblues-scenes:/app/data/scenes
      - moodyblues-sessions:/app/data/sessions
    networks:
      default: {} # talks to `db`
      proxy:
        aliases:
          - moodyblues-backend # the Forward Hostname to enter in Nginx Proxy Manager

volumes:
  moodyblues-db-data:
  moodyblues-scenes:
  moodyblues-sessions:

networks:
  proxy:
    external: true # the network the already-running Nginx Proxy Manager container is on
